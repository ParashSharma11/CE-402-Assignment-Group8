  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN (Zero-build styling) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "system-ui", "-apple-system", "sans-serif"],
            mono: ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"]
          }
        }
      }
    };
  </script>

  <!-- Plotly.js CDN (Interactive engineering charts) -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>

  <style>
    /* Subtle precision scrollbar for wide data tables */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Hide default number spinners for crisp spreadsheet-like numeric cells */
    input[type="number"].clean-num::-webkit-inner-spin-button,
    input[type="number"].clean-num::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"].clean-num {
      -moz-appearance: textfield;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

            <path d="M3 12h18" />
            <path d="M3 17h18" />

            <path d="M16 12v5" />
          </svg>

        <div class="min-w-0">
          <div class="flex items-center gap-2">

        </div>
      </div>

        <div class="hidden md:inline-flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-full px-3 py-1 text-[11px] font-mono text-slate-300">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>

    <!-- Sleek Module Navigation Strip -->

          <button
            type="button"
            role="tab"
            id="btn-tab-p5"

    </nav>
  </header>

  <!-- Fluid Engineering Workspace -->
  <main class="flex-1 max-w-[1440px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div id="tab-p1" class="tab-panel" role="tabpanel" aria-labelledby="btn-tab-p1"></div>
    <div id="tab-p2" class="tab-panel hidden" role="tabpanel" aria-labelledby="btn-tab-p2"></div>

  <!-- Minimal Technical Footer -->

      <span>CE-402 Geotechnical Design Platform &mdash; Group 8</span>
      <span class="font-mono">EN 1997-1 &middot; ASTM D2487 &middot; IS 2131:1981 &middot; &gamma;<sub>w</sub> = 9.81 kN/m&sup3;</span>
    </div>
  </footer>

  <!-- Lightweight Tab-Switching Controller -->
  <script>
    (function initTabNavigation() {
      var tabButtons = document.querySelectorAll(".tab-btn");
      var tabPanels = document.querySelectorAll(".tab-panel");

      var BTN_ACTIVE = ["bg-white", "text-slate-950", "shadow-sm"];
      var BTN_INACTIVE = ["text-slate-300", "hover:bg-slate-800", "hover:text-white"];
      var PILL_ACTIVE = ["bg-indigo-600", "text-white"];
      var PILL_INACTIVE = ["bg-slate-800", "text-slate-300", "group-hover:bg-slate-700"];

      function activateTab(targetId) {
        tabButtons.forEach(function (btn) {
          var isMatch = btn.getAttribute("data-tab-target") === targetId;
          var pill = btn.querySelector(".tab-pill");
          btn.setAttribute("aria-selected", String(isMatch));

          if (isMatch) {
            btn.classList.remove.apply(btn.classList, BTN_INACTIVE);
            btn.classList.add.apply(btn.classList, BTN_ACTIVE);
            if (pill) {
              pill.classList.remove.apply(pill.classList, PILL_INACTIVE);
              pill.classList.add.apply(pill.classList, PILL_ACTIVE);
            }
          } else {
            btn.classList.remove.apply(btn.classList, BTN_ACTIVE);
            btn.classList.add.apply(btn.classList, BTN_INACTIVE);
            if (pill) {
              pill.classList.remove.apply(pill.classList, PILL_ACTIVE);
              pill.classList.add.apply(pill.classList, PILL_INACTIVE);
            }
          }
        });

        tabPanels.forEach(function (panel) {
          var isMatch = panel.id === targetId;
          panel.classList.toggle("hidden", !isMatch);

          if (isMatch && typeof window.Plotly !== "undefined") {
            var plots = panel.querySelectorAll(".js-plotly-plot");
            plots.forEach(function (plotEl) {
              window.Plotly.Plots.resize(plotEl);
            });
          }
        });
      }

      tabButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          activateTab(btn.getAttribute("data-tab-target"));
        });
      });

      window.activateGeotechTab = activateTab;
    })();
  </script>
